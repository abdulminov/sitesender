name: worker_app_bot

services:
  bot:
    image: {{ image_name }} 
    container_name: worker_app_bot
    volumes: 
      - ~/app/cookies.txt:/code/cookies.txt:rw
    command: python SiteSender.py
    restart: always
    ports:
      - "5000:5000"
    tmpfs:
      - /tmp
    environment:
      - DB_NAME=bot_db
      - DB_USER=admin
      - DB_PASSWORD={{ vault_db_password }}
      - DB_HOST={{ groups['masters'] | map('extract', hostvars, 'ansible_host') | first }}
      - DB_PORT=5432
      - BOT_TOKEN={{ vault_vk_token }}
      - MY_NODE_NAME={{ inventory_hostname }}
      - YTDLP_JS_RUNTIME=node
    healthcheck:
      test: [
        "CMD-SHELL",
        "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:5000/health\", timeout=3)'"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
