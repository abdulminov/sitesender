<style>
    /* Говорим браузеру: если текст внутри ячейки с классом url-text дошел до края, 
       принудительно перенеси его на следующую строку, а не растягивай таблицу */
    .url-text {
        word-break: break-all;
        display: block; /* Помогает браузеру правильно рассчитать перенос внутри таблицы */
    }
    
    /* Устанавливаем разумную фиксированную ширину для колонки с URL, 
       чтобы подстроить таблицу под ваш экран (можно менять цифру) */
    .url-col {
        width: 40%; 
    }
</style>

<a href="/logs/">Все</a> | 
<a href="/logs/?status=500">Только ошибки</a> | 
<a href="/logs/?status=200">Только успех</a>

<h1>Мониторинг Бота</h1>
<!-- Вернули вашу оригинальную таблицу с border="1" -->
<table border="1">
    <tr>
        <th>Дата</th>
        <th>Пользователь</th>
        <th class="url-col">URL</th> <!-- Задали ширину для заголовка колонки -->
        <th>Статус</th>
        <th>Время (сек)</th>
        <th>Ошибка</th>
    </tr>
    {% for log in logs %}
    <tr>
        <td>{{ log.created_at }}</td>
        <td>{{ log.user_id }}</td>
        <!-- Обернули ПОЛНЫЙ url в тег <td> и применили класс для переноса строк -->
        <td>
            <span class="url-text">{{ log.url }}</span>
        </td>
        <td>{{ log.status_code }}</td>
        <td>{{ log.execution_time }}</td>
        <td>{{ log.error_message }}</td>
    </tr>
    {% endfor %}
</table>
