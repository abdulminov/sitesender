[tool.ruff]
# проверять код в папке рекурсивно
src = ["app"]
# исключить из проверки папки сборки, если они появятся
exclude = [".git", "__pycache__", ".venv"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

# отключаем правила для конкретных файлов
[tool.ruff.lint.per-file-ignores]
# разрешаем слепые исключения BLE001 и импорты не в начале файла E402
"app/bot/SiteSender.py" = ["BLE001", "E402"]
# разрешаем несоответствовать некоторым строгим правилам
"app/web/manage.py" = ["INP001"]
# игнорируем автосгенерированные файлы миграций в части длины строк
"app/commot/logs/migrations/*" = ["E501"]
